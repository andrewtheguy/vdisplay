[package]
name = "vdisplay"
version = "0.1.0"
edition = "2024"
publish = false
description = "Menu-bar tool that adds CGVirtualDisplay screens to a Mac at a chosen size and density"

[dependencies]
anyhow = "1"
objc2 = "0.6"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSControl",
    "NSCell",
    "NSView",
    "NSResponder",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSAlert",
    "NSTextField",
    "NSText",
    "NSPopUpButton",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSGeometry",
    "NSString",
] }
